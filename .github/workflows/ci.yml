name: CI

on:
  push:
  pull_request:
  schedule:
  - cron: "0 0 * * *"

jobs:
  test:
    runs-on: ubuntu-latest
    container: continuumio/miniconda3:latest

    steps:
    - uses: actions/checkout@v7
    - name: Build
      run: |
        pip install .
    - name: Test
      run: |
        conda install pytest
        cd test-suite
        pytest
